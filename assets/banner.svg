<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Bell Metallic Gradient -->
    <linearGradient id="bell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="pulse-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #f3e8ff;
    }

    /* Keyframe Animations */
    @keyframes ring {
      0%, 100% { transform: rotate(0deg); }
      10%, 30%, 50% { transform: rotate(12deg); }
      20%, 40% { transform: rotate(-12deg); }
      60% { transform: rotate(0deg); }
    }

    @keyframes expand-ring {
      0% { r: 45px; opacity: 0.8; stroke-width: 4px; }
      100% { r: 95px; opacity: 0; stroke-width: 1px; }
    }

    @keyframes float-particle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.5; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 0.9; }
    }

    @keyframes pulse-gradient {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .bell-icon {
      transform-origin: 160px 120px;
      animation: ring 4s infinite ease-in-out;
    }

    .wave-1 {
      animation: expand-ring 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    .wave-2 {
      animation: expand-ring 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      animation-delay: 1s;
    }
    .wave-3 {
      animation: expand-ring 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      animation-delay: 2s;
    }

    .p1 { animation: float-particle 4s infinite ease-in-out; }
    .p2 { animation: float-particle 5s infinite ease-in-out 1s; }
    .p3 { animation: float-particle 3.5s infinite ease-in-out 0.5s; }

    .glow-bg {
      animation: pulse-gradient 4s infinite ease-in-out;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="300" rx="20" fill="url(#bg-grad)" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="160" cy="150" r="100" fill="#a855f7" opacity="0.25" class="glow-bg" filter="url(#pulse-glow)" />
  <circle cx="1020" cy="80" r="140" fill="#6366f1" opacity="0.15" class="glow-bg" filter="url(#pulse-glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M200 0V300 M400 0V300 M600 0V300 M800 0V300 M1000 0V300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Animated Pulse Waves from Bell -->
  <circle cx="160" cy="145" r="45" fill="none" stroke="#a855f7" class="wave-1" />
  <circle cx="160" cy="145" r="45" fill="none" stroke="#ec4899" class="wave-2" />
  <circle cx="160" cy="145" r="45" fill="none" stroke="#6366f1" class="wave-3" />

  <!-- Floating Decorative Particles -->
  <circle cx="100" cy="80" r="5" fill="#38bdf8" class="p1" />
  <circle cx="230" cy="220" r="4" fill="#f472b6" class="p2" />
  <circle cx="210" cy="70" r="6" fill="#fbbf24" class="p3" />
  <circle cx="1100" cy="210" r="5" fill="#a855f7" class="p1" />

  <!-- Notification Bell Icon (Animated) -->
  <g class="bell-icon" filter="url(#glow)">
    <!-- Bell Body -->
    <path d="M160 95 C140 95 125 110 125 130 V155 C125 160 120 165 112 170 H208 C200 165 195 160 195 155 V130 C195 110 180 95 160 95 Z" fill="url(#bell-grad)" />
    <!-- Bell Clapper -->
    <path d="M148 178 C148 184 153 189 160 189 C167 189 172 184 172 178 Z" fill="#d97706" />
    <!-- Top Ring -->
    <circle cx="160" cy="90" r="7" fill="none" stroke="#fbbf24" stroke-width="3" />
    <!-- Notification Badge Dot -->
    <circle cx="190" cy="105" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Main Header Text & Accent Line -->
  <g transform="translate(280, 0)">
    <!-- Top Decorative Line -->
    <rect x="0" y="72" width="120" height="4" rx="2" fill="url(#accent-grad)" />
    
    <!-- Title -->
    <text x="0" y="130" class="title">Awesome Push Notifications 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Curated Push Platforms, Mobile/Web SDKs, &amp; Open-Source Push Servers</text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 200)">
      <!-- Badge 1: Open Source -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#22c55e" />
      <text x="30" y="21" class="badge-text">Open Source First</text>

      <!-- Badge 2: Multi-Channel -->
      <rect x="175" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="191" cy="16" r="5" fill="#a855f7" />
      <text x="205" y="21" class="badge-text">Web, iOS, Android</text>

      <!-- Badge 3: Self-Hosted -->
      <rect x="355" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="371" cy="16" r="5" fill="#38bdf8" />
      <text x="385" y="21" class="badge-text">Self-Hosted Solutions</text>
    </g>
  </g>
</svg>
